<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizCard AI - Leitor de Cartões</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    <header class="bg-white p-6 rounded-xl shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-blue-600"><i class="fa-solid me-2 fa-address-card"></i>BizCard AI</h1>
        <p class="text-sm text-gray-500">Digitalização Inteligente de Cartões de Visita</p>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Painel de Captura -->
      <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
        <h2 class="text-lg font-semibold text-gray-700">Capturar / Enviar Cartão</h2>
        
        <div id="cameraContainer" class="relative bg-black rounded-lg overflow-hidden h-48 hidden flex items-center justify-center">
          <video id="video" class="w-full h-full object-cover -scale-x-100" autoplay playsinline></video>
          <button id="snapBtn" class="absolute bottom-3 bg-red-600 text-white px-4 py-2 rounded-full font-bold shadow hover:bg-red-700 transition">
            <i class="fa-solid fa-camera me-1"></i> Fotografar
          </button>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button id="toggleCameraBtn" class="w-full py-2 px-4 bg-blue-50 text-blue-600 font-semibold rounded-lg hover:bg-blue-100 border border-blue-200 transition">
            <i class="fa-solid fa-video me-1"></i> Câmara
          </button>
          <label class="w-full py-2 px-4 bg-gray-50 text-gray-700 font-semibold rounded-lg hover:bg-gray-100 border border-gray-200 text-center cursor-pointer transition">
            <i class="fa-solid fa-upload me-1"></i> Ficheiro
            <input type="file" id="fileInput" accept="image/*" class="hidden">
          </label>
        </div>

        <div id="status" class="hidden text-sm text-center p-3 rounded-lg"></div>
      </div>

      <!-- Formulário de Contacto -->
      <div class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-lg font-semibold text-gray-700 mb-4">Dados do Contacto</h2>
        <form id="contactForm" class="space-y-3">
          <input type="hidden" id="contactId">
          
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase">Nome *</label>
            <input type="text" id="name" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase">Empresa</label>
            <input type="text" id="company" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase">Telefone</label>
            <input type="text" id="phone" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase">Email</label>
            <input type="email" id="email" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div class="flex gap-2 pt-2">
            <button type="submit" class="flex-1 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition">
              <i class="fa-solid fa-floppy-disk me-1"></i> Guardar
            </button>
            <button type="button" id="resetBtn" class="py-2 px-4 bg-gray-200 text-gray-600 font-semibold rounded-lg hover:bg-gray-300 transition">
              Limpar
            </button>
          </div>
        </form>
      </div>

    </div>

    <!-- Lista de Contactos -->
    <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
        <h2 class="text-lg font-semibold text-gray-700">Contactos Guardados</h2>
        <input type="text" id="searchInput" placeholder="Pesquisar..." class="p-2 border rounded-lg text-sm w-full sm:w-64 outline-none">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 border-b">
            <tr>
              <th class="p-3">Nome</th>
              <th class="p-3">Empresa</th>
              <th class="p-3">Telefone</th>
              <th class="p-3">Email</th>
              <th class="p-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="contactsTableBody" class="divide-y">
            <tr><td colspan="5" class="p-4 text-center text-gray-400">A carregar contactos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <script>
    const video = document.getElementById('video');
    const cameraContainer = document.getElementById('cameraContainer');
    const toggleCameraBtn = document.getElementById('toggleCameraBtn');
    const snapBtn = document.getElementById('snapBtn');
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');
    const contactForm = document.getElementById('contactForm');
    const contactsTableBody = document.getElementById('contactsTableBody');
    const searchInput = document.getElementById('searchInput');

    let stream = null;

    // Gestão da Câmara
    toggleCameraBtn.addEventListener('click', async () => {
      if (stream) {
        stopCamera();
      } else {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          video.srcObject = stream;
          cameraContainer.classList.remove('hidden');
          toggleCameraBtn.textContent = 'Fechar Câmara';
        } catch (err) {
          showStatus('Não foi possível aceder à câmara.', 'error');
        }
      }
    });

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      cameraContainer.classList.add('hidden');
      toggleCameraBtn.innerHTML = '<i class="fa-solid fa-video me-1"></i> Câmara';
    }

    // Processar Foto Tirada
    snapBtn.addEventListener('click', () => {
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      stopCamera();
      processImage(canvas.toDataURL('image/jpeg'));
    });

    // Processar Ficheiro Carregado
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => processImage(evt.target.result);
      reader.readAsDataURL(file);
    });

    // Enviar para o scan.php
    async function processImage(base64Image) {
      showStatus('A analisar cartão com IA...', 'info');
      try {
        const res = await fetch('scan.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('name').value = data.data.name || '';
          document.getElementById('company').value = data.data.company || '';
          document.getElementById('phone').value = data.data.phone || '';
          document.getElementById('email').value = data.data.email || '';
          showStatus('Cartão lido com sucesso!', 'success');
        } else {
          showStatus(data.error || 'Falha na leitura do cartão.', 'error');
        }
      } catch (err) {
        showStatus('Erro na comunicação com o servidor.', 'error');
      }
    }

    // Carregar Contactos
    async function loadContacts(query = '') {
      try {
        const res = await fetch(`api.php?q=${encodeURIComponent(query)}`);
        const contacts = await res.json();
        
        if (!Array.isArray(contacts)) throw new Error();

        if (contacts.length === 0) {
          contactsTableBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">Nenhum contacto encontrado.</td></tr>';
          return;
        }

        contactsTableBody.innerHTML = contacts.map(c => `
          <tr class="hover:bg-gray-50">
            <td class="p-3 font-medium">${escapeHtml(c.name)}</td>
            <td class="p-3 text-gray-600">${escapeHtml(c.company || '-')}</td>
            <td class="p-3 text-gray-600">${escapeHtml(c.phone || '-')}</td>
            <td class="p-3 text-gray-600">${escapeHtml(c.email || '-')}</td>
            <td class="p-3 text-right space-x-2">
              <button onclick="editContact(${c.id}, '${escapeHtml(c.name)}', '${escapeHtml(c.company)}', '${escapeHtml(c.phone)}', '${escapeHtml(c.email)}')" class="text-blue-600 hover:text-blue-800"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteContact(${c.id})" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        contactsTableBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-red-500">Erro ao carregar contactos.</td></tr>';
      }
    }

    // Guardar / Atualizar
    contactForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        id: document.getElementById('contactId').value || null,
        name: document.getElementById('name').value,
        company: document.getElementById('company').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
      };

      try {
        const res = await fetch('api.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          showStatus('Contacto guardado com sucesso!', 'success');
          contactForm.reset();
          document.getElementById('contactId').value = '';
          loadContacts();
        } else {
          showStatus(data.error || 'Erro ao guardar.', 'error');
        }
      } catch (err) {
        showStatus('Erro ao comunicar com a base de dados.', 'error');
      }
    });

    // Apagar Contacto
    async function deleteContact(id) {
      if (!confirm('Deseja eliminar este contacto?')) return;
      try {
        const res = await fetch(`api.php?id=${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) loadContacts();
      } catch (err) {
        alert('Não foi possível apagar o contacto.');
      }
    }

    // Editar
    window.editContact = (id, name, company, phone, email) => {
      document.getElementById('contactId').value = id;
      document.getElementById('name').value = name === 'null' ? '' : name;
      document.getElementById('company').value = company === 'null' ? '' : company;
      document.getElementById('phone').value = phone === 'null' ? '' : phone;
      document.getElementById('email').value = email === 'null' ? '' : email;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.getElementById('resetBtn').addEventListener('click', () => {
      contactForm.reset();
      document.getElementById('contactId').value = '';
    });

    searchInput.addEventListener('input', (e) => loadContacts(e.target.value));

    function showStatus(msg, type) {
      statusDiv.classList.remove('hidden', 'bg-blue-100', 'text-blue-700', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
      if (type === 'info') statusDiv.classList.add('bg-blue-100', 'text-blue-700');
      if (type === 'success') statusDiv.classList.add('bg-green-100', 'text-green-700');
      if (type === 'error') statusDiv.classList.add('bg-red-100', 'text-red-700');
      statusDiv.textContent = msg;
    }

    function escapeHtml(str) {
      if (!str || str === 'null') return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    // Inicializar
    loadContacts();
  </script>
</body>
</html>
