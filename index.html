<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizCard OCR v2 - Gestão Acessível de Contactos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- OCR Local Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 213, 225, 0.9);
    }
    .file-label-focus:focus-within {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-900 min-h-screen relative overflow-x-hidden pb-12">

  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/30 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
  </div>

  <main class="relative z-10 max-w-6xl mx-auto px-4 pt-6 space-y-6">
    
    <header class="glass-card p-6 rounded-2xl shadow-2xl flex flex-col sm:flex-row justify-between items-center gap-4 border border-white/20">
      <div class="flex items-center space-x-4">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-700 to-indigo-700 flex items-center justify-center text-white text-2xl shadow-lg shadow-blue-500/30" aria-hidden="true">
          <i class="fa-solid fa-users-gear"></i>
        </div>
        <div>
          <h1 class="text-2xl font-extrabold text-slate-900">
            BizCard OCR <span class="text-xs px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 font-bold align-middle border border-blue-300">v2.0 Acessível</span>
          </h1>
          <p class="text-xs font-semibold text-slate-700">Gestão de Contactos, Categorias e Leitura OCR (WCAG 2.1 AA)</p>
        </div>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Captura e Texto Bruto -->
      <section class="lg:col-span-6 glass-card p-6 rounded-2xl shadow-xl space-y-4 border border-slate-200" aria-labelledby="sec1-title">
        <h2 id="sec1-title" class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-camera text-blue-700" aria-hidden="true"></i> 1. Captura &amp; Leitura
        </h2>

        <div id="cameraContainer" class="relative bg-slate-950 rounded-xl overflow-hidden h-48 hidden flex items-center justify-center border border-slate-800">
          <video id="video" class="w-full h-full object-cover" autoplay playsinline aria-label="Pré-visualização da câmara"></video>
          <button id="snapBtn" type="button" class="absolute bottom-3 bg-red-700 hover:bg-red-800 text-white px-4 py-2 rounded-full font-bold text-xs shadow-lg flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2">
            <i class="fa-solid fa-camera" aria-hidden="true"></i> Fotografar
          </button>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button id="toggleCameraBtn" type="button" class="py-2.5 px-4 bg-blue-100 text-blue-900 font-bold rounded-xl hover:bg-blue-200 border border-blue-300 shadow-sm transition text-xs flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:ring-offset-2">
            <i class="fa-solid fa-video text-blue-700" aria-hidden="true"></i> <span>Abrir Câmara</span>
          </button>
          <label class="file-label-focus py-2.5 px-4 bg-slate-100 text-slate-900 font-bold rounded-xl hover:bg-slate-200 border border-slate-300 shadow-sm text-center cursor-pointer transition text-xs flex items-center justify-center gap-2">
            <i class="fa-solid fa-upload text-indigo-700" aria-hidden="true"></i> <span>Carregar Ficheiro</span>
            <input type="file" id="fileInput" accept="image/*" class="sr-only" aria-label="Carregar ficheiro de imagem de cartão de visita">
          </label>
        </div>

        <div id="status" role="status" aria-live="polite" class="hidden text-xs font-bold text-center p-3 rounded-xl"></div>

        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label for="rawText" class="block text-xs font-bold text-slate-800 uppercase tracking-wider">
              Texto Bruto Extraído (OCR)
            </label>
            <button type="button" id="parseRawBtn" class="text-xs font-bold text-blue-700 hover:text-blue-900 underline focus:outline-none focus:ring-2 focus:ring-blue-700 rounded-sm">
              <i class="fa-solid fa-wand-magic-sparkles me-1" aria-hidden="true"></i> Mapear Campos
            </button>
          </div>
          <textarea id="rawText" rows="6" placeholder="O texto reconhecido no cartão aparecerá aqui..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-700 focus:ring-offset-1 transition resize-y"></textarea>
        </div>
      </section>

      <!-- Formulário Mapeado -->
      <section class="lg:col-span-6 glass-card p-6 rounded-2xl shadow-xl border border-slate-200 space-y-4" aria-labelledby="sec2-title">
        <h2 id="sec2-title" class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-id-card text-indigo-700" aria-hidden="true"></i> 2. Campos Organizados
        </h2>

        <form id="contactForm" class="space-y-3.5" aria-label="Formulário de dados do contacto">
          <input type="hidden" id="contactId">
          
          <div>
            <label for="name" class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1">Nome *</label>
            <input type="text" id="name" required placeholder="ex.: Michael Teixeira" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-700 focus:ring-offset-1 transition text-xs font-medium">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="company" class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1">Empresa / Cargo</label>
              <input type="text" id="company" placeholder="ex.: CEO Digitextus" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-700 focus:ring-offset-1 transition text-xs font-medium">
            </div>

            <div>
              <label for="tipo" class="block text-xs font-bold text-blue-900 uppercase tracking-wider mb-1">Tipo de Contacto *</label>
              <select id="tipo" required class="w-full p-2.5 bg-blue-50 border border-blue-300 rounded-xl text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-700 focus:ring-offset-1 transition text-xs font-bold">
                <option value="Potencial Cliente">Potencial Cliente</option>
                <option value="Cliente">Cliente</option>
                <option value="Fornecedor">Fornecedor</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="phone" class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1">Telefone</label>
              <input type="text" id="phone" placeholder="ex.: +351 967 605 414" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-700 focus:ring-offset-1 transition text-xs font-medium">
            </div>

            <div>
              <label for="email" class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1">Email</label>
              <input type="email" id="email" placeholder="ex.: contacto@empresa.pt" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-700 focus:ring-offset-1 transition text-xs font-medium">
            </div>
          </div>

          <div class="flex items-center gap-2 pt-2">
            <button type="submit" class="flex-1 py-3 px-4 bg-gradient-to-r from-blue-700 to-indigo-700 text-white font-bold rounded-xl shadow-md hover:from-blue-800 hover:to-indigo-800 focus:outline-none focus:ring-2 focus:ring-blue-700 focus:ring-offset-2 transition-all text-xs flex items-center justify-center gap-2">
              <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Guardar no Supabase
            </button>
            <button type="button" id="resetBtn" class="py-3 px-4 bg-slate-200 text-slate-800 font-bold rounded-xl hover:bg-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-700 focus:ring-offset-2 transition text-xs">
              Limpar
            </button>
          </div>
        </form>
      </section>

    </div>

    <!-- Tabela de Contactos -->
    <section class="glass-card p-6 rounded-2xl shadow-xl border border-slate-200 space-y-4" aria-labelledby="sec3-title">
      <div class="flex flex-col md:flex-row justify-between items-center gap-3">
        <h2 id="sec3-title" class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-database text-blue-700" aria-hidden="true"></i> Base de Dados Supabase
        </h2>

        <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto">
          <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-xl border border-slate-300 text-xs">
            <label for="filterTipo" class="font-bold text-slate-800 flex items-center gap-1">
              <i class="fa-solid fa-filter text-slate-600" aria-hidden="true"></i> Filtrar:
            </label>
            <select id="filterTipo" class="bg-transparent font-bold text-slate-900 outline-none cursor-pointer focus:ring-2 focus:ring-blue-700 rounded-md">
              <option value="Todos">Todos os Tipos</option>
              <option value="Potencial Cliente">Potencial Cliente</option>
              <option value="Cliente">Cliente</option>
              <option value="Fornecedor">Fornecedor</option>
            </select>
          </div>

          <div class="w-full md:w-64">
            <label for="searchInput" class="sr-only">Pesquisar contactos por nome ou empresa</label>
            <input type="text" id="searchInput" placeholder="Pesquisar nome/empresa..." class="w-full p-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-700">
          </div>
        </div>
      </div>

      <div class="overflow-x-auto focus:outline-none focus:ring-2 focus:ring-blue-700 rounded-xl" tabindex="0" aria-label="Tabela de contactos">
        <table class="w-full text-left text-xs" aria-label="Lista de contactos registados">
          <thead class="bg-slate-100 border-b border-slate-300 uppercase text-[10px] font-extrabold text-slate-800">
            <tr>
              <th scope="col" class="p-3">Nome</th>
              <th scope="col" class="p-3">Tipo</th>
              <th scope="col" class="p-3">Empresa</th>
              <th scope="col" class="p-3">Telefone</th>
              <th scope="col" class="p-3">Email</th>
              <th scope="col" class="p-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="contactsTableBody" class="divide-y divide-slate-200">
            <tr><td colspan="6" class="p-4 text-center text-slate-700 font-medium">A carregar contactos...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <canvas id="canvas" class="hidden" aria-hidden="true"></canvas>

  <script>
    const SUPABASE_URL = "https://yhonxysuusxuvjkcpize.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_sEFa9_zBdnkXGaqpmoymXA_qm33wCpo"; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const video = document.getElementById('video');
    const cameraContainer = document.getElementById('cameraContainer');
    const toggleCameraBtn = document.getElementById('toggleCameraBtn');
    const snapBtn = document.getElementById('snapBtn');
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');
    const rawTextArea = document.getElementById('rawText');
    const parseRawBtn = document.getElementById('parseRawBtn');
    const contactForm = document.getElementById('contactForm');
    const searchInput = document.getElementById('searchInput');
    const filterTipo = document.getElementById('filterTipo');
    const contactsTableBody = document.getElementById('contactsTableBody');

    let stream = null;

    toggleCameraBtn.addEventListener('click', async () => {
      if (stream) {
        stopCamera();
      } else {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } 
          });
          video.srcObject = stream;
          cameraContainer.classList.remove('hidden');
          toggleCameraBtn.innerHTML = '<i class="fa-solid fa-xmark text-red-600" aria-hidden="true"></i> <span>Fechar Câmara</span>';
          showStatus('Câmara aberta.', 'info');
        } catch (err) {
          showStatus('Não foi possível aceder à câmara.', 'error');
        }
      }
    });

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      cameraContainer.classList.add('hidden');
      toggleCameraBtn.innerHTML = '<i class="fa-solid fa-video text-blue-700" aria-hidden="true"></i> <span>Abrir Câmara</span>';
    }

    snapBtn.addEventListener('click', () => {
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      stopCamera();
      runOCR(canvas.toDataURL('image/jpeg', 0.95));
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      const reader = new FileReader();

      reader.onload = (evt) => {
        img.onload = () => {
          const canvas = document.getElementById('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          runOCR(canvas.toDataURL('image/jpeg', 0.95));
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    async function runOCR(imageSrc) {
      showStatus('A ler texto do cartão com Tesseract OCR...', 'info');
      try {
        const result = await Tesseract.recognize(imageSrc, 'por+eng');
        const text = result.data.text;

        rawTextArea.value = text;
        showStatus('Texto lido com sucesso!', 'success');

        parseRawTextToFields(text);
      } catch (err) {
        showStatus('Erro ao ler a imagem.', 'error');
      }
    }

    parseRawBtn.addEventListener('click', () => {
      parseRawTextToFields(rawTextArea.value);
      showStatus('Campos mapeados a partir do texto bruto.', 'info');
    });

    rawTextArea.addEventListener('input', () => {
      parseRawTextToFields(rawTextArea.value);
    });

    function sanitizeVal(str) {
      if (!str) return '';
      return str
        .replace(/^[0-9\s|{}]+/g, '')
        .replace(/^["'“”‘’:\s|,{}]+|["'“”‘’,;\s|{}]+$/g, '')
        .trim();
    }

    function parseRawTextToFields(text) {
      if (!text) return;

      let name = '';
      let company = '';
      let phone = '';
      let email = '';

      const lines = text.split('\n').map(l => l.replace(/^[0-9\s|{}]+/g, '').trim()).filter(l => l.length > 0);

      lines.forEach(line => {
        const lower = line.toLowerCase();

        if (lower.includes('@') || lower.includes('mail')) {
          const emailMatch = line.match(/[a-zA-Z0-9._%+-]+(?:\s*@\s*)[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/i);
          if (emailMatch) {
            email = emailMatch[0].replace(/\s+/g, '');
          } else if (line.includes(':')) {
            const val = line.split(':').slice(1).join(':').replace(/\s+/g, '');
            if (val.includes('@') || val.includes('.')) {
              email = val.replace(/[^a-zA-Z0-9._%+-@]/g, '');
            }
          }
        }

        if (lower.includes('phone') || lower.includes('tel') || lower.includes('mobile') || lower.includes('+351') || /\d{9}/.test(line)) {
          const phoneMatch = line.match(/(?:\+351\s*)?(?:9[1236]|2\d)[\s.-]?\d{3}[\s.-]?\d{3,4}|\+\d{1,3}[\s.-]?\d{6,12}|\b\d{9}\b/);
          if (phoneMatch) {
            phone = phoneMatch[0].trim();
          } else if (line.includes(':')) {
            phone = line.split(':').slice(1).join(':');
          }
        }

        if (lower.includes('name') || lower.includes('nome')) {
          if (line.includes(':')) {
            name = line.split(':').slice(1).join(':');
          }
        }

        if (lower.includes('company') || lower.includes('title') || lower.includes('empresa') || lower.includes('cargo') || lower.includes('he"') || lower.includes('he:')) {
          if (line.includes(':')) {
            company = line.split(':').slice(1).join(':');
          }
        }
      });

      if (!email) {
        const em = text.match(/[a-zA-Z0-9._%+-]+(?:\s*@\s*)[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/);
        if (em) email = em[0].replace(/\s+/g, '');
      }
      if (!phone) {
        const ph = text.match(/(?:\+351\s*)?(?:9[1236]|2\d)[\s.-]?\d{3}[\s.-]?\d{3,4}|\+\d{1,3}[\s.-]?\d{6,12}|\b\d{9}\b/);
        if (ph) phone = ph[0].trim();
      }

      if (!name || !company) {
        const cleanLines = lines.filter(l => {
          const sanitized = sanitizeVal(l);
          if (sanitized.length < 3) return false;
          if (email && sanitized.includes(email)) return false;
          if (phone && sanitized.includes(phone)) return false;
          return true;
        });

        if (!name && cleanLines.length > 0) {
          name = cleanLines[0].includes(':') ? cleanLines[0].split(':').slice(1).join(':') : cleanLines[0];
        }
        if (!company && cleanLines.length > 1) {
          company = cleanLines[1].includes(':') ? cleanLines[1].split(':').slice(1).join(':') : cleanLines[1];
        }
      }

      document.getElementById('name').value = sanitizeVal(name);
      document.getElementById('company').value = sanitizeVal(company);
      document.getElementById('phone').value = sanitizeVal(phone);
      document.getElementById('email').value = sanitizeVal(email);
    }

    // Carregar Contactos com Fallback Inteligente caso a coluna 'tipo' ainda não exista no Supabase
    async function loadContacts() {
      try {
        let req = supabaseClient.from('contacts').select('*').order('id', { ascending: false });

        const searchVal = searchInput.value.trim();
        const tipoVal = filterTipo.value;

        if (tipoVal !== 'Todos') {
          req = req.eq('tipo', tipoVal);
        }

        if (searchVal) {
          req = req.or(`name.ilike.%${searchVal}%,company.ilike.%${searchVal}%`);
        }

        let { data: contacts, error } = await req;

        // Se a consulta por 'tipo' falhar porque a coluna ainda não foi criada, tenta sem ela
        if (error) {
          console.warn("Deteção de tabela sem coluna 'tipo'. A carregar lista geral:", error.message);
          let fallbackReq = supabaseClient.from('contacts').select('*').order('id', { ascending: false });
          if (searchVal) {
            fallbackReq = fallbackReq.or(`name.ilike.%${searchVal}%,company.ilike.%${searchVal}%`);
          }
          const res = await fallbackReq;
          if (res.error) throw res.error;
          contacts = res.data;
        }

        renderTableRows(contacts);
      } catch (err) {
        contactsTableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-700 font-bold">Erro ao carregar dados do Supabase: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function renderTableRows(contacts) {
      if (!contacts || contacts.length === 0) {
        contactsTableBody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-700 font-medium">Nenhum contacto encontrado.</td></tr>';
        return;
      }

      contactsTableBody.innerHTML = contacts.map(c => {
        let badgeColor = 'bg-slate-200 text-slate-900 border-slate-300';
        if (c.tipo === 'Potencial Cliente') badgeColor = 'bg-amber-100 text-amber-950 border-amber-300';
        if (c.tipo === 'Cliente') badgeColor = 'bg-emerald-100 text-emerald-950 border-emerald-300';
        if (c.tipo === 'Fornecedor') badgeColor = 'bg-purple-100 text-purple-950 border-purple-300';

        const safeName = escapeHtml(c.name);

        return `
          <tr class="hover:bg-slate-100 transition">
            <td class="p-3 font-bold text-slate-900">${safeName}</td>
            <td class="p-3">
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${badgeColor}">
                ${escapeHtml(c.tipo || 'Potencial Cliente')}
              </span>
            </td>
            <td class="p-3 text-slate-800">${escapeHtml(c.company || '-')}</td>
            <td class="p-3 text-slate-800">${escapeHtml(c.phone || '-')}</td>
            <td class="p-3 text-slate-800">${escapeHtml(c.email || '-')}</td>
            <td class="p-3 text-right space-x-1">
              <button onclick="editContact(${c.id}, '${safeName}', '${escapeHtml(c.company)}', '${escapeHtml(c.phone)}', '${escapeHtml(c.email)}', '${escapeHtml(c.tipo)}')" aria-label="Editar contacto de ${safeName}" class="p-2 text-blue-700 hover:text-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-700 rounded-lg">
                <i class="fa-solid fa-pen" aria-hidden="true"></i>
              </button>
              <button onclick="deleteContact(${c.id}, '${safeName}')" aria-label="Eliminar contacto de ${safeName}" class="p-2 text-red-700 hover:text-red-900 focus:outline-none focus:ring-2 focus:ring-red-700 rounded-lg">
                <i class="fa-solid fa-trash" aria-hidden="true"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    contactForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const id = document.getElementById('contactId').value;
      let payload = {
        name: document.getElementById('name').value,
        company: document.getElementById('company').value || null,
        phone: document.getElementById('phone').value || null,
        email: document.getElementById('email').value || null,
        tipo: document.getElementById('tipo').value
      };

      let result;
      if (id) {
        result = await supabaseClient.from('contacts').update(payload).eq('id', id);
      } else {
        result = await supabaseClient.from('contacts').insert([payload]);
      }

      // Se falhar por falta da coluna 'tipo' no Supabase, envia sem o campo tipo
      if (result.error && result.error.message.includes('tipo')) {
        delete payload.tipo;
        if (id) {
          result = await supabaseClient.from('contacts').update(payload).eq('id', id);
        } else {
          result = await supabaseClient.from('contacts').insert([payload]);
        }
      }

      if (result.error) {
        showStatus('Erro ao guardar no Supabase: ' + result.error.message, 'error');
      } else {
        showStatus('Contacto guardado com sucesso!', 'success');
        contactForm.reset();
        document.getElementById('tipo').value = 'Potencial Cliente';
        rawTextArea.value = '';
        document.getElementById('contactId').value = '';
        loadContacts();
      }
    });

    async function deleteContact(id, name) {
      if (!confirm(`Deseja eliminar o contacto "${name}"?`)) return;
      const { error } = await supabaseClient.from('contacts').delete().eq('id', id);
      if (error) {
        showStatus('Erro ao eliminar: ' + error.message, 'error');
      } else {
        showStatus(`Contacto "${name}" eliminado com sucesso!`, 'info');
        loadContacts();
      }
    }

    window.editContact = (id, name, company, phone, email, tipo) => {
      document.getElementById('contactId').value = id;
      document.getElementById('name').value = name === 'null' ? '' : name;
      document.getElementById('company').value = company === 'null' ? '' : company;
      document.getElementById('phone').value = phone === 'null' ? '' : phone;
      document.getElementById('email').value = email === 'null' ? '' : email;
      document.getElementById('tipo').value = (tipo && tipo !== 'null') ? tipo : 'Potencial Cliente';
      
      showStatus(`A editar contacto de "${name}".`, 'info');
      document.getElementById('name').focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.getElementById('resetBtn').addEventListener('click', () => {
      contactForm.reset();
      document.getElementById('tipo').value = 'Potencial Cliente';
      rawTextArea.value = '';
      document.getElementById('contactId').value = '';
      showStatus('Formulário limpo.', 'info');
    });

    searchInput.addEventListener('input', loadContacts);
    filterTipo.addEventListener('change', loadContacts);

    function showStatus(msg, type) {
      statusDiv.classList.remove('hidden', 'bg-blue-100', 'text-blue-900', 'border-blue-300', 'bg-emerald-100', 'text-emerald-950', 'border-emerald-300', 'bg-rose-100', 'text-rose-950', 'border-rose-300');
      statusDiv.classList.add('border');
      if (type === 'info') statusDiv.classList.add('bg-blue-100', 'text-blue-900', 'border-blue-300');
      if (type === 'success') statusDiv.classList.add('bg-emerald-100', 'text-emerald-950', 'border-emerald-300');
      if (type === 'error') statusDiv.classList.add('bg-rose-100', 'text-rose-950', 'border-rose-300');
      statusDiv.textContent = msg;
    }

    function escapeHtml(str) {
      if (!str || str === 'null') return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    loadContacts();
  </script>
</body>
</html>
